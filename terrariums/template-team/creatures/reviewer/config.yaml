# Reviewer creature.
#
# This role evaluates maker output and either approves it or asks for revisions.

name: reviewer
version: "0.1.0"

controller:
  model: "${OPENROUTER_MODEL:google/gemini-2.5-flash}"
  api_key_env: OPENROUTER_API_KEY
  base_url: https://openrouter.ai/api/v1
  temperature: 0.2
  tool_format: bracket

system_prompt_file: prompts/system.md

tools:
  - name: think
    type: builtin
  - name: info
    type: builtin
  - name: read
    type: builtin
  - name: glob
    type: builtin
  - name: grep
    type: builtin
