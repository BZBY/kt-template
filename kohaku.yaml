name: kt-template
version: "0.1.0"
description: "Starter KohakuTerrarium package with creature, terrarium, and module templates"

creatures:
  - name: template-creature

terrariums:
  - name: template-team

tools:
  - name: template_package_tool
    module: kt_template.tools.package_tool
    class: TemplatePackageTool

subagents:
  - name: template_package_subagent
    module: kt_template.subagents.package_subagent
    # Sub-agents are config objects (SubAgentConfig), not classes —
    # the framework finds them by scanning the module for a
    # SubAgentConfig instance. No `class:` field needed.

triggers:
  - name: template_package_trigger
    module: kt_template.triggers.package_trigger
    class: TemplatePackageTrigger

plugins:
  - name: template_package_plugin
    module: kt_template.plugins.package_plugin
    class: TemplatePackagePlugin

io:
  - name: template_package_input
    module: kt_template.inputs.package_input
    class: TemplatePackageInput
  - name: template_package_output
    module: kt_template.outputs.package_output
    class: TemplatePackageOutput
